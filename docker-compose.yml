version: "3.9"

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    hostname: rabbit
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - testnet

  ingest-api:
    image: ingest-api
    container_name: ingest-api
    ports:
      - "3003:3003"    
    depends_on:
      - rabbitmq
    environment:
      RABBITMQ_URL: amqp://rabbitmq
      PORT: 3003
      PIPELINE_API_URL: http://pipeline-registry:3002
    networks:
      - testnet

  worker-python:
    image: worker-python
    container_name: worker-python
    depends_on:
      - rabbitmq
    networks:
      - testnet
    volumes:
      - ./artifacts_files/python-scripts:/app/scripts
    environment:
      RABBIT_URL: amqp://rabbitmq
      REGISTRY_URL: http://pipeline-registry:3002
      ROUTING_KEY: workerpython

  worker-db:
    image: worker-db
    container_name: worker-db
    depends_on:
      - rabbitmq
    networks:
      - testnet
    environment:
      RABBIT_URL: amqp://rabbitmq
      REGISTRY_URL: http://pipeline-registry:3002
      ROUTING_KEY: bd_manager
      PGHOST: pg-project-data-db
      PGPORT: 5432
      PGDATABASE: otiappdb
      PGUSER: ${PROJECT_DATA_WRITER_USER}
      PGPASSWORD: ${PROJECT_DATA_WRITER_PASSWORD}
  
  db-api:
    image: db-api
    container_name: db-api
    ports:
      - "3004:3004"    
    networks:
      - testnet
    environment:
      PGHOST: pg-project-data-db
      PGPORT: 5432
      PGDATABASE: otiappdb
      PGUSER: ${PROJECT_DATA_READER_USER}
      PGPASSWORD: ${PROJECT_DATA_READER_PASSWORD}

  pipeline-registry:
    image: pipeline-registry
    container_name: pipeline-registry
    ports:
      - "3002:3002"
    networks:
      - testnet
    volumes:
      - ./artifacts_files/pipelines:/app/src/pipelines
      - pipelines_data:/data
    environment:
      - PIPELINE_DB_PATH=/data/pipeline.db.json

volumes:
  pipelines_data:
networks:
  testnet:
    external: true
